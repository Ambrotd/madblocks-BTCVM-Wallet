[package]
name = "btcvm-wallet-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Keys, addresses, bridge checks and transactions for Bitcoin and BTCVM, shared by the madblocks BTCVM Wallet."
authors = ["madblocks <https://madblocks.tech>"]
license = "MIT"
publish = false

[dependencies]
k256 = { version = "0.13", features = ["ecdsa", "sha256"] }
sha2 = "0.10"
hmac = "0.12"
ripemd = "0.1"
bs58 = "0.5"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = "1"

[dev-dependencies]
serde_json = "1"
