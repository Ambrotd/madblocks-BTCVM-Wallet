[package]
name = "release-tool"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Signs madblocks Metal Wallet releases: makes the update key, writes latest.json, and signs it and the exe (minisign)."
authors = ["madblocks <https://madblocks.tech>"]
license = "MIT"
publish = false

[dependencies]
minisign = "0.7"
sha2 = "0.10"
hex = "0.4"
serde_json = "1"
